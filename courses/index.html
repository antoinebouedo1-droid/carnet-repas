<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courses</title><meta http-equiv="refresh" content="0;url=/courses/"></head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>L'appli Courses a déménagé : <a href="/courses/">ouvrir l'appli Courses</a>.</p>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if (r.scope.endsWith("/carnet-repas/courses/")) r.unregister(); })).catch(()=>{});
location.replace("/courses/");
</script></body></html>
