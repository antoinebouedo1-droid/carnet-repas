<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet repas d'Antoine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F6F4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: app mobile à une colonne, barre d'onglets fixe en bas, sélecteur de semaine en haut. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#16231C; --muted:#5C6B63; --line:#D5DDD8;
  --accent:#1F6F4A; --accent-ink:#FFFFFF;
  --course:#2E7D32; --course-bg:#E1F0E2;
  --renfo:#9A5B00; --renfo-bg:#F7EAD3;
  --repos:#5C6B63; --repos-bg:#E4E9E6;
  --wod:#2F5BB0; --wod-bg:#E2E9F7;
  --done:#9AA7A0;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#18221C; --ink:#E6EEE9; --muted:#9AAAA1; --line:#2A3830;
  --accent:#5CC58F; --accent-ink:#0B1A12;
  --course:#7FD18A; --course-bg:#1D3322; --renfo:#E9B45E; --renfo-bg:#3A2C12; --repos:#A3B1A9; --repos-bg:#253029; --wod:#9DB8F2; --wod-bg:#1D2A45;
  --done:#5E6B64; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18221C; --ink:#E6EEE9; --muted:#9AAAA1; --line:#2A3830;
  --accent:#5CC58F; --accent-ink:#0B1A12;
  --course:#7FD18A; --course-bg:#1D3322; --renfo:#E9B45E; --renfo-bg:#3A2C12; --repos:#A3B1A9; --repos-bg:#253029; --wod:#9DB8F2; --wod-bg:#1D2A45;
  --done:#5E6B64; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.75rem;color:var(--muted)}
.weeks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.weeks::-webkit-scrollbar{display:none}
.weeks button{flex:0 0 auto;min-width:92px}
.weeks button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.weeks button b{font-family:var(--f-display);font-size:.9rem;white-space:nowrap}
.weeks button span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.weeks button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks button[aria-pressed="true"] span{color:var(--bg);opacity:.75}
main{display:flex;flex-direction:column;gap:14px;padding-top:6px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.day{display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dayname{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.dayname small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px;font-variant-numeric:tabular-nums}
.today-flag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-left:6px}
.chip{font:inherit;font-size:.78rem;font-weight:700;border:0;border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip[data-t="course"]{background:var(--course-bg);color:var(--course)}
.chip[data-t="renfo"]{background:var(--renfo-bg);color:var(--renfo)}
.chip[data-t="repos"]{background:var(--repos-bg);color:var(--repos)}
.chip[data-t="wod"]{background:var(--wod-bg);color:var(--wod)}
.meals{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.meal{display:grid;grid-template-columns:52px 1fr 28px;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.hour{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.what{min-width:0}
.what b{display:block;font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.what p{margin:1px 0 0}
.meal.is-done .what p{color:var(--done);text-decoration:line-through}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.tick svg{width:14px;height:14px;opacity:0}
.tick[aria-checked="true"] svg{opacity:1}
button:focus-visible,.row:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.tips{grid-template-columns:repeat(4,1fr)}}
.poids form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.poids input{font:inherit;width:96px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.poids h3{font-family:var(--f-display);margin:0 0 4px;font-size:1rem}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums;font-size:.85rem}
.hist li{background:var(--bg);border-radius:8px;padding:4px 8px;color:var(--muted)}
.hist li b{color:var(--ink)}
.alert{margin:10px 0 0;padding:10px;border-radius:10px;background:var(--renfo-bg);color:var(--renfo);font-size:.88rem}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.8rem;color:var(--muted)}
.tip b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.rayon h3{font-family:var(--f-display);font-size:.95rem;margin:0 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row input{position:absolute;opacity:0;pointer-events:none}
.row .tick{flex:none}
.row span.lbl{min-width:0;padding-top:2px}
.row.is-done span.lbl{color:var(--done);text-decoration:line-through}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.warn{border-color:var(--renfo);color:var(--renfo)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
.steps li::marker{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.note{font-size:.85rem;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{font:inherit;font-size:.72rem;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.swap{background:var(--wod-bg);color:var(--wod);border-radius:4px;padding:0 3px}
.flag{display:inline-block;margin-left:6px;font-size:.72rem;font-weight:700;color:var(--renfo);background:var(--renfo-bg);border-radius:99px;padding:1px 8px;vertical-align:1px}
.gform{display:flex;flex-direction:column;gap:10px}
.gform label{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.gform input{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.glist{list-style:none;margin:0;padding:0}
.glist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.glist li:first-child{border-top:0}
.glist .gtxt{flex:1;min-width:0}
.glist .gtxt small{display:block;color:var(--muted)}
.x{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:8px}
.boite h3{font-family:var(--f-display);margin:0 0 6px;font-size:1rem}
.boite ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini{font:inherit;font-size:.75rem;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--accent);border-radius:99px;padding:3px 10px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row .mini{margin-left:auto;flex:none}
.placard li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.placard li:first-child{border-top:0}
.placard ul{list-style:none;margin:8px 0 0;padding:0}
.ravito form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ravito input{font:inherit;width:6em;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.mini[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.9rem}
.panel h4{margin:0 0 4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.panel ul,.panel ol{margin:0 0 8px;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.panel .opt{display:block;width:100%;text-align:left;font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;margin-top:6px;cursor:pointer}
.panel .opt b{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;display:block}
.swapped{font-size:.75rem;color:var(--wod);font-weight:700}
.bilan{display:flex;flex-direction:column;gap:8px}
.bilan .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.bilan .rows{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.85rem}
.bilan .rows .bar{height:6px}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Carnet repas</h1><span class="sync" id="sync">Chargement…</span></div>
    <div class="weeks" id="weeks" role="group" aria-label="Semaine"></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="jour" id="tab-jour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button data-tab="semaine" id="tab-semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</button>
  <button data-tab="courses" id="tab-courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Courses</button>
  <button data-tab="batch" id="tab-batch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20M9 7c0-1 1-1.5 1-2.5M14 7c0-1 1-1.5 1-2.5"/></svg>Dimanche</button>
  <button data-tab="gouts" id="tab-gouts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Mes goûts</button>
</nav>

<script>
const JOURS = {lun:"Lundi",mar:"Mardi",mer:"Mercredi",jeu:"Jeudi",ven:"Vendredi",sam:"Samedi",dim:"Dimanche"};
const ORDRE = ["lun","mar","mer","jeu","ven","sam","dim"];
const TYPES = ["course","wod","renfo","repos"];
const TYPE_LBL = {course:"Course",wod:"WOD",renfo:"Renfo",repos:"Repos"};
const TYPE_DESC = {course:"Jour de course.",wod:"Entraînement aujourd'hui.",renfo:"Exercices de renfo pendant environ 50 min.",repos:"Aucune activité physique aujourd'hui."};
const TYPE_TITRE = {course:"Jour de course",wod:"Jour de WOD",renfo:"Jour de renfo",repos:"Jour de repos"};
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

const state = { weeks:{}, suivi:{}, week:null, tab:"jour", hideDone:false, confirmReset:false, db:null, ready:false, profil:null };
try { state.tab = localStorage.getItem("tab") || "jour"; state.hideDone = localStorage.getItem("hideDone")==="1"; } catch(e){}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function addDays(isoStr, n){ const [y,m,d]=isoStr.split("-").map(Number); const dt=new Date(y,m-1,d+n); return dt; }
const fmtShort = dt => dt.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(".","");

function weekList(){ return Object.values(state.weeks).sort((a,b)=>(a.num||0)-(b.num||0)); }
function currentWeekId(){
  const today = iso(new Date());
  for (const w of weekList()){ if (!w.debut) continue; const end = iso(addDays(w.debut,6)); if (today>=w.debut && today<=end) return w.id; }
  const l = weekList(); return l.length ? l[0].id : null;
}
function suivi(id){ return state.suivi[id] || {}; }
function dayType(w, j){ return (suivi(w.id).types||{})[j.j] || j.type || "repos"; }

function petitDej(t){
  return (t==="course"||t==="wod") ? "70 g de flocons d'avoine, 30 g d'amandes, 20-30 g de chia, 200 g de fromage blanc, 2 cc de miel + 1 fruit"
                      : "50 g de flocons d'avoine, 30 g d'amandes, 20-30 g de chia, 200 g de fromage blanc, 2 cc de miel + 1 fruit" + (t==="repos" ? " + 20 g de noix dans le fromage blanc" : "");
}
function collation(t, j){
  if (j.collation && t===(j.type||t)) return j.collation;
  const C = state.profil && state.profil.collations; if (C && C[t]) return C[t];
  return t==="repos" ? "1 pomme + 1 barre de céréales" : "1 banane + 1 barre de céréales";
}
function collationSoir(t, j){
  if (t!=="renfo" && t!=="wod") return null;
  if (j.collation_soir && t===(j.type||t)) return j.collation_soir;
  const C = state.profil && state.profil.collation_soir; return (C && C[t]) || "200 g de skyr ou de fromage blanc + 1 cc de miel ou 1 fruit";
}
function seance(t){ return t==="course" ? "Course vers 18 h 30. Eau ; au-delà de 1 h 15, gourde avec un peu de sirop." : t==="wod" ? "WOD vers 18 h 30. Eau, à petites gorgées entre les blocs." : t==="renfo" ? "Renfo vers 18 h 30. Eau." : null; }

function write(id, patch){
  const cur = structuredClone(state.suivi[id] || {});
  for (const k in patch){ cur[k] = Object.assign({}, cur[k]||{}, patch[k]); }
  state.suivi[id] = cur;
  try{ localStorage.setItem(LS, JSON.stringify(state.suivi)); }catch(_){ setSync("Pas enregistré : mémoire du navigateur indisponible."); }
  render();
}

function setSync(t){ document.getElementById("sync").textContent = t; }

function renderWeeks(){
  const el = document.getElementById("weeks");
  const l = weekList();
  const slots = l.length ? l : [1,2,3].map(n => ({id:"s"+n, num:n, placeholder:true}));
  el.innerHTML = slots.map(w => {
    const range = w.debut ? fmtShort(addDays(w.debut,0))+" – "+fmtShort(addDays(w.debut,6)) : "à venir";
    return `<button id="wk-${w.id}" data-week="${w.id}" aria-pressed="${state.week===w.id}"><b>${esc(w.court || "Sem. "+w.num)}</b><span>${esc(range)}</span></button>`;
  }).join("");
  const sel = document.getElementById("wk-"+state.week);
  if (sel && el.dataset.scrolled !== state.week){ el.dataset.scrolled = state.week; el.scrollLeft = sel.offsetLeft - el.offsetWidth/2 + sel.offsetWidth/2; }
}

const GK="carnet-gouts";
let GOUTS=[]; try{ GOUTS=JSON.parse(localStorage.getItem(GK)||"[]"); }catch(_){ GOUTS=[]; }
function saveGouts(){ try{ localStorage.setItem(GK, JSON.stringify(GOUTS)); }catch(_){} }
const SUGG = {"saumon":"cabillaud","thon":"sardines","poulet":"dinde","dinde":"poulet","boeuf":"porc","bœuf":"dinde","jambon":"blanc de poulet","quinoa":"boulgour","boulgour":"quinoa","semoule":"riz","lentilles":"pois chiches","lentilles corail":"lentilles vertes","pois chiches":"haricots blancs","haricots rouges":"haricots blancs","brocoli":"haricots verts","brocolis":"haricots verts","épinards":"haricots verts","champignons":"courgettes","courgettes":"haricots verts","poivron":"carotte","poivrons":"carottes","butternut":"patate douce","patate douce":"pommes de terre","patates douces":"pommes de terre","avocat":"concombre","feta":"mozzarella","comté":"emmental","parmesan":"emmental","fromage blanc":"skyr","yaourt grec":"skyr","œufs":"tofu","oeufs":"tofu","lait de coco":"crème légère","gnocchis":"pâtes","tortillas":"pain pita","chia":"graines de lin","amandes":"noisettes","beurre de cacahuète":"purée d'amande","pain d'épices":"barre de céréales","kiwis":"oranges","bananes":"compotes","banane":"compote","oignons rouges":"oignons jaunes","mozzarella":"feta","pesto":"sauce tomate","maïs":"petits pois","carottes":"poivrons","tomates cerises":"concombre","chili":"curry"};
const ACC = {a:"aàâä",e:"eéèêë",i:"iîï",o:"oôöœ",u:"uùûü",c:"cç"};
const PK="carnet-placard", NK="carnet-notes";
let PLACARD={}, NOTES={};
try{ PLACARD=JSON.parse(localStorage.getItem(PK)||"{}"); }catch(_){ PLACARD={}; }
try{ NOTES=JSON.parse(localStorage.getItem(NK)||"{}"); }catch(_){ NOTES={}; }
function saveKey(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
function aliment(label){
  return norm(label.replace(/\([^)]*\)/g,"")).replace(/^[\d,.\s]+(kg|g|l|cl|ml)?\s+/,"").replace(/^(petite?s?|grosse?s?)\s+/,"")
    .replace(/^(pots?|sachets?|boites?|bocal|bocaux|briques?|paquets?|barquettes?|tetes?|tranches?|filets?|paves?)\s+/,"").replace(/^(de\s+|d['’])/,"").replace(/s$/,"").trim();
}
function norm(x){ return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").trim(); }
function pattern(word){
  let w = norm(word).replace(/(es|s|x)$/,"");
  const body = [...w].map(ch => ACC[ch] ? "["+ACC[ch]+ACC[ch].toUpperCase()+"]" : ch.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("").replace(/\s+/g,"\\s+").replace(/\[oôöœOÔÖŒ\]\[eéèêëEÉÈÊË\]/g,"(?:oe|œ|Œ)");
  return new RegExp("(^|[^\\p{L}])("+body+"(?:es|s|x)?)(?![\\p{L}])","giu");
}
function adapt(text){
  let out = esc(text); const manque = [];
  for (const g of GOUTS){
    const re = pattern(g.a);
    if (!re.test(out)) continue;
    re.lastIndex = 0;
    if (g.r) out = out.replace(re, (m,pre)=>pre+'<span class="swap">'+esc(g.r)+'</span>');
    else manque.push(g.a);
  }
  return out + manque.map(a=>`<span class="flag">contient : ${esc(a)}</span>`).join("");
}

function recetteDe(txt){ return txt && state.recettes ? state.recettes[txt] : null; }
function platDuJour(w, j, kind){
  const sw = (suivi(w.id).swaps||{})[j.j+"-"+kind];
  const src = sw ? (w.jours||[]).find(x=>x.j===sw) : null;
  return src ? {txt: src[kind==="dej"?"dejeuner":"diner"], from: sw} : {txt: j[kind==="dej"?"dejeuner":"diner"], from: null};
}
function mealExtras(w, j, kind){
  const key = j.j+"-"+kind, uid = w.id+":"+key;
  const plat = platDuJour(w, j, kind), rec = recetteDe(plat.txt);
  const openR = state.open===uid+":r", openS = state.open===uid+":s";
  let html = plat.from ? `<div class="swapped">Échangé avec ${JOURS[plat.from].toLowerCase()}</div>` : "";
  html += `<div class="acts">${rec?`<button class="mini" data-open="${uid}:r" aria-expanded="${openR}">Recette${rec.temps?" · "+esc(rec.temps):""}</button>`:""}<button class="mini" data-open="${uid}:s" aria-expanded="${openS}">Échanger</button>${["top","bof"].map(n=>`<button class="mini" data-note="${n}" data-plat="${esc(plat.txt)}" aria-pressed="${NOTES[plat.txt]===n}">${n==="top"?"J'adore":"Bof"}</button>`).join("")}</div>`;
  if (openR && rec) html += `<div class="panel">${(rec.ingredients||[]).length?`<h4>Ingrédients</h4><ul>${rec.ingredients.map(x=>`<li>${adapt(x)}</li>`).join("")}</ul>`:""}${(rec.etapes||[]).length?`<h4>Étapes</h4><ol>${rec.etapes.map(x=>`<li>${adapt(x)}</li>`).join("")}</ol>`:""}</div>`;
  if (openS){
    const champ = kind==="dej"?"dejeuner":"diner";
    const opts = (w.jours||[]).filter(x=>x.j!==j.j && x[champ] && x[champ]!==plat.txt);
    const vus = new Set();
    html += `<div class="panel"><h4>Remplacer par un ${kind==="dej"?"déjeuner":"dîner"} de la semaine</h4>${opts.filter(x=>!vus.has(x[champ]) && vus.add(x[champ])).map(x=>`<button class="opt" data-swap="${key}" data-src="${x.j}"><b>${JOURS[x.j]}</b>${adapt(x[champ])}</button>`).join("")}${plat.from?`<button class="opt" data-swap="${key}" data-src=""><b>Revenir au plat prévu</b>${adapt(j[champ])}</button>`:""}</div>`;
  }
  return html;
}

function mealRow(w, key, hour, label, text, extras){
  const done = !!(suivi(w.id).faits||{})[key];
  return `<li class="meal ${done?"is-done":""}"><span class="hour">${hour}</span><div class="what"><b>${label}</b><p>${adapt(text)}</p>${extras||""}</div>
    <button class="tick" role="checkbox" aria-checked="${done}" aria-label="${label} fait" data-fait="${key}">${CHECK}</button></li>`;
}

function dayCard(w, j, isToday){
  const t = dayType(w,j);
  const dt = w.debut ? addDays(w.debut, ORDRE.indexOf(j.j)) : null;
  const s = seance(t);
  return `<section class="card day">
    <div class="dayhead"><div class="dayname">${JOURS[j.j]}${dt?`<small>${fmtShort(dt)}</small>`:""}${isToday?'<span class="today-flag">Aujourd\'hui</span>':""}</div>
      <button class="chip" data-t="${t}" data-type="${j.j}" aria-label="Type de journée : ${TYPE_LBL[t]}. Toucher pour changer">${TYPE_LBL[t]}</button></div>
    <ul class="meals">
      ${mealRow(w, j.j+"-pdj","7 h","Petit-déj",petitDej(t))}
      ${mealRow(w, j.j+"-dej","12 h","Déjeuner",platDuJour(w,j,"dej").txt, mealExtras(w,j,"dej"))}
      ${mealRow(w, j.j+"-col","16 h 30","Collation",collation(t,j))}
      ${s?`<li class="meal"><span class="hour">18 h 30</span><div class="what"><b>Séance</b><p>${esc(s)}</p></div><span></span></li>`:""}
      ${mealRow(w, j.j+"-din","20 h","Dîner",platDuJour(w,j,"din").txt + (state.profil?.portions?.diner ? " · "+state.profil.portions.diner : ""), mealExtras(w,j,"din"))}
      ${collationSoir(t,j) ? mealRow(w, j.j+"-soir","21 h 30","Collation du soir",collationSoir(t,j).replace(/\s*\(vers 21 h 30\)/,"")) : ""}
    </ul></section>`;
}

function emptyWeek(n){
  return `<div class="card empty"><b>Semaine ${n} en préparation</b>Le menu de cette semaine arrive avec le prévisionnel sur 3 semaines. Il s'affichera ici tout seul.</div>`;
}

function viewJour(w){
  if (!w || w.placeholder) return emptyWeek(w?w.num:1);
  const todayIso = iso(new Date());
  let j = null;
  if (w.debut){ const idx = ORDRE.findIndex((_,i)=>iso(addDays(w.debut,i))===todayIso); if (idx>=0) j = (w.jours||[]).find(x=>x.j===ORDRE[idx]); }
  const debutPlan = weekList().map(x=>x.debut).filter(Boolean).sort()[0];
  const intro = j ? "" : (debutPlan && todayIso < debutPlan)
    ? `<p class="sub">Ton plan démarre le lundi ${addDays(debutPlan,0).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}. En attendant, voici un aperçu du premier jour. Pense aux courses et au batch cooking du dimanche.</p>`
    : `<p class="sub">Aujourd'hui n'est pas dans cette semaine. Voici le lundi.</p>`;
  if (!j) j = (w.jours||[])[0];
  if (!j) return emptyWeek(w.num);
  const t = dayType(w,j);
  const eau = t==="repos" ? "2 L" : "2,5 L";
  const R = (state.profil && state.profil.reperes_quotidiens && state.profil.reperes_quotidiens[t]) || DEF_REPERES[t];
  const fr = (a,u) => a[0].toLocaleString("fr-FR")+"-"+a[1].toLocaleString("fr-FR")+u;
  return `<h2>${TYPE_TITRE[t]}</h2><p class="sub">${TYPE_DESC[t]}</p>${intro}
    <div class="tips"><div class="tip"><b>${fr(R.kcal," kcal")}</b>d'énergie</div><div class="tip"><b>${fr(R.glucides_g," g")}</b>de glucides</div><div class="tip"><b>${fr(R.proteines_g," g")}</b>de protéines</div><div class="tip"><b>${eau}</b>d'eau</div></div>
    ${dayCard(w,j,!intro)}
    <p class="note">Touche l'étiquette ${TYPE_LBL[t]} pour changer le type de journée : le petit-déj, la collation et les repères s'adaptent.</p>
    ${state.profil?.objectif ? `<section class="card"><h3 style="font-family:var(--f-display);margin:0 0 4px;font-size:1rem">Objectif prise de masse</h3><p class="note" style="margin:0 0 6px">${esc(state.profil.objectif)}</p>${state.profil.portions?`<ul class="note" style="margin:0;padding-left:1.1em">${[["Petit-déj",state.profil.portions.petit_dejeuner],["Déjeuner",state.profil.portions.dejeuner],["Dîner",state.profil.portions.diner]].filter(x=>x[1]).map(x=>`<li><b>${x[0]} :</b> ${esc(x[1])}</li>`).join("")}</ul>`:""}</section>` : ""}
    ${(state.profil?.conseils||[]).length ? `<section class="card"><h3 style="font-family:var(--f-display);margin:0 0 6px;font-size:1rem">Repères du quotidien</h3><ul class="note" style="margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px">${state.profil.conseils.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></section>` : ""}
    ${viewRavito()}
    ${viewPoids()}`;
}
function hm(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h ? h+" h"+(m?" "+String(m).padStart(2,"0"):"") : m+" min"; }
function ravito(min){
  if (!(min>0)) return "";
  if (min<=75) return `<p class="note" style="margin:10px 0 0">${hm(min)} : pas besoin de ravito. Ta collation de 16 h 30 et une gourde d'eau suffisent.</p>`;
  const h = min/60, total = Math.round(45*h), ban = total>=100?2:1, bar = Math.max(0, Math.round((total-25*ban)/22)), gourdes = Math.ceil(h);
  const quoi = [ban+" banane"+(ban>1?"s":""), bar?bar+" barre"+(bar>1?"s":"")+" de céréales":""].filter(Boolean).join(" + ");
  return `<div style="margin-top:10px"><p style="margin:0"><b>${hm(min)} : ${quoi}</b></p>
    <ul class="note" style="margin:6px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px">
    <li>Objectif : ${Math.round(30*h)} à ${Math.round(60*h)} g de glucides (30 à 60 g par heure). Ici environ ${25*ban+22*bar} g.</li>
    <li>Banane ≈ 25 g, barre de céréales ≈ 20 à 25 g de glucides.</li>
    <li>Commence à manger après 30 à 45 min, puis un morceau toutes les 30 à 40 min.</li>
    <li>Eau : environ 500 ml par heure, soit ${gourdes} gourde${gourdes>1?"s":""} de 500 ml (remplis en route si besoin).</li>
    ${bar+ban>2?`<li>Pense à ajouter ces barres et bananes en plus aux courses.</li>`:""}</ul></div>`;
}
function viewRavito(){
  return `<section class="card ravito"><h3 style="font-family:var(--f-display);margin:0 0 4px;font-size:1rem">Ravito sortie longue</h3>
    <p class="note" style="margin:0 0 10px">Entre la durée prévue de ta sortie : au-delà de 1 h 15, l'appli te dit quoi emporter.</p>
    <form id="ravito-form"><label for="ravito-min" class="note">Durée (minutes)</label><input id="ravito-min" type="number" inputmode="numeric" min="10" max="600" step="5" placeholder="105" value="${state.ravito||""}"></form>
    <div id="ravito-out">${ravito(state.ravito)}</div></section>`;
}

const DEF_REPERES = {
  course:{kcal:[3000,3200],glucides_g:[370,400],proteines_g:[110,125]},
  renfo:{kcal:[2750,2900],glucides_g:[300,330],proteines_g:[110,125]},
  repos:{kcal:[2550,2700],glucides_g:[280,310],proteines_g:[110,125]},
  wod:{kcal:[2900,3100],glucides_g:[340,370],proteines_g:[115,130]}};
const kg = v => Number(v).toLocaleString("fr-FR",{maximumFractionDigits:1});
function rythme(){
  const e = (state.suivi.poids||{}).entries || {};
  const dates = Object.keys(e).filter(d=>typeof e[d]==="number").sort();
  if (dates.length<2) return null;
  const ld = dates[dates.length-1], ref = dates.find(d=>d>=iso(addDays(ld,-17)) && d<ld) || dates[dates.length-2];
  const jours = (new Date(ld) - new Date(ref))/864e5;
  return {jours, parSem: jours>0 ? (e[ld]-e[ref])/jours*7 : 0};
}
function conseilBalance(){
  const r = rythme();
  if (!r || r.jours<13) return {cls:"note", txt:"Pèse-toi une fois par semaine : après 2 semaines, l'appli te dira s'il faut ajuster tes portions."};
  const v = (r.parSem>=0?"+":"")+kg(r.parSem)+" kg par semaine";
  if (r.parSem<0.2) return {cls:"alert", txt:`Balance : ${v} sur 2 semaines, c'est sous l'objectif (+0,2 à 0,3). Ajoute une portion : +20 g de riz ou de pâtes crus au déjeuner.`};
  if (r.parSem>0.4) return {cls:"alert", txt:`Balance : ${v} sur 2 semaines, c'est un peu rapide. Retire une portion : 20 g de riz ou de pâtes crus en moins au déjeuner.`};
  return {cls:"note", txt:`Balance : ${v} sur 2 semaines, c'est le bon rythme. Ne change rien.`};
}
function viewPoids(){
  const e = (state.suivi.poids||{}).entries || {};
  const dates = Object.keys(e).filter(d=>typeof e[d]==="number").sort();
  const last = dates.slice(-5);
  let alert = "";
  if (dates.length>=2){ const c = conseilBalance(); alert = `<p class="${c.cls}" style="margin:10px 0 0">${esc(c.txt)}</p>`; }
  const rule = "Pèse-toi une fois par semaine, le matin à jeun. Objectif +0,2 à 0,3 kg par semaine : l'appli te dit s'il faut ajouter ou retirer une portion.";
  let chart = "";
  if (dates.length >= 2){
    const W=320, H=170, L=34, R=10, T=10, B=24;
    const t0 = new Date(dates[0]).getTime(), t1 = Math.max(new Date(dates[dates.length-1]).getTime(), t0 + 14*864e5);
    const wk = t => (t - t0)/(7*864e5);
    const e0 = e[dates[0]], wmax = wk(t1);
    const vals = dates.map(d=>e[d]).concat([e0 + 0.3*wmax, e0]);
    let lo = Math.floor((Math.min(...vals)-0.3)*2)/2, hi = Math.ceil((Math.max(...vals)+0.3)*2)/2;
    const x = t => L + (t - t0)/(t1 - t0)*(W-L-R), y = v => T + (hi - v)/(hi - lo)*(H-T-B);
    const band = `${x(t0)},${y(e0+0.2*0)} ${x(t1)},${y(e0+0.2*wmax)} ${x(t1)},${y(e0+0.3*wmax)} ${x(t0)},${y(e0)}`;
    const ticks = []; for (let v=lo; v<=hi+1e-9; v+=0.5) ticks.push(v);
    const step = Math.max(1, Math.ceil(ticks.length/5));
    const pts = dates.map(d=>[x(new Date(d).getTime()), y(e[d])]);
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe du poids">
      ${ticks.filter((_,i)=>i%step===0).map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${kg(v)}</text>`).join("")}
      <polygon points="${band}" fill="var(--course-bg)" stroke="none"/>
      <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`).join("")}
      <text x="${L}" y="${H-6}">${fmtShort(addDays(dates[0],0))}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fmtShort(new Date(t1))}</text>
    </svg><div class="legend"><span><i style="background:var(--course-bg)"></i>Zone visée (+0,2 à 0,3 kg/sem.)</span><span><i style="background:var(--accent)"></i>Tes pesées</span></div>`;
  } else if (dates.length === 1){
    chart = `<p class="note" style="margin:10px 0 0">La courbe apparaît dès ta deuxième pesée.</p>`;
  }
  return `<section class="card poids"><h3>Pesée de la semaine</h3><p class="note" style="margin:0 0 10px">${esc(rule)}</p>
    <form id="poids-form"><label for="poids-kg" class="note">Poids (kg)</label><input id="poids-kg" type="number" inputmode="decimal" step="0.1" min="30" max="150" placeholder="62,0" required><button class="btn" type="submit">Enregistrer</button></form>
    ${last.length?`<ul class="hist">${last.map(d=>`<li>${fmtShort(addDays(d,0))} <b>${kg(e[d])} kg</b></li>`).join("")}</ul>`:""}
    ${chart}
    ${alert}</section>`;
}

const CATS = [["pdj","Petit-déj"],["dej","Déjeuner"],["col","Collation"],["din","Dîner"],["soir","Collation du soir"]];
const FEM = {col:true, soir:true};
function viewBilan(w){
  const today = iso(new Date());
  if (!w.debut || today < w.debut) return "";
  const faits = suivi(w.id).faits || {};
  const stats = {}; CATS.forEach(([k])=>stats[k]={fait:0,total:0});
  let jours = 0;
  (w.jours||[]).forEach(j=>{
    const d = iso(addDays(w.debut, ORDRE.indexOf(j.j)));
    if (d > today) return;
    jours++;
    const t = dayType(w,j);
    CATS.forEach(([k])=>{ if (k==="soir" && !collationSoir(t,j)) return; stats[k].total++; if (faits[j.j+"-"+k]) stats[k].fait++; });
  });
  if (!jours) return "";
  const tot = CATS.reduce((a,[k])=>a+stats[k].total,0), ok = CATS.reduce((a,[k])=>a+stats[k].fait,0);
  const manques = CATS.filter(([k])=>stats[k].total>=2 && stats[k].total-stats[k].fait>=2 && (stats[k].total-stats[k].fait)/stats[k].total>=0.4);
  const remarque = !ok ? "Coche tes repas au fil de la journée pour voir ton bilan."
    : manques.length ? manques.map(([k,l])=>`${l} manqué${FEM[k]?"e":""} ${stats[k].total-stats[k].fait} fois sur ${stats[k].total}`).join(" · ") + ". " + (manques.some(([k])=>k==="col") ? "Garde ta banane et ta barre dans ton sac pour 16 h 30." : manques.some(([k])=>k==="pdj") ? "Prépare ton bol la veille pour gagner du temps le matin." : manques.some(([k])=>k==="soir") ? "Mets le skyr bien en vue dans le frigo après la séance." : "Prévois une solution de secours rapide pour ce repas.")
    : "Rien de souvent manqué, continue comme ça.";
  return `<section class="card bilan"><h3 style="font-family:var(--f-display);margin:0;font-size:1rem">Bilan de la semaine${w.debut && iso(addDays(w.debut,6))>=today?" (en cours)":""}</h3>
    <div><span class="big">${ok} / ${tot}</span> <span class="note">repas suivis sur ${jours} jour${jours>1?"s":""}</span></div>
    <div class="rows">${CATS.filter(([k])=>stats[k].total).map(([k,l])=>`<span>${l}</span><div class="bar"><i style="width:${Math.round(100*stats[k].fait/stats[k].total)}%"></i></div><span class="count">${stats[k].fait}/${stats[k].total}</span>`).join("")}</div>
    <p class="note" style="margin:0">${remarque}</p>
    ${(c=>`<p class="${c.cls}" style="margin:0">${esc(c.txt)}</p>`)(conseilBalance())}</section>`;
}

function viewSemaine(w){
  if (!w || w.placeholder) return emptyWeek(w?w.num:1);
  const todayIso = iso(new Date());
  const counts = {course:0,wod:0,renfo:0,repos:0};
  (w.jours||[]).forEach(j=>counts[dayType(w,j)]++);
  const resume = TYPES.filter(t=>counts[t]).map(t=>counts[t]+" "+TYPE_LBL[t].toLowerCase().replace("wod","WOD")).join(" · ");
  return `<h2>${esc(w.theme || "Semaine "+w.num)}</h2>
    <p class="sub">${resume}. Touche une étiquette pour l'ajuster à ta semaine réelle.</p>
    ${viewBilan(w)}
    ${(w.jours||[]).map((j,i)=>dayCard(w,j, w.debut && iso(addDays(w.debut,ORDRE.indexOf(j.j)))===todayIso)).join("")}`;
}

function viewCourses(w){
  if (!w || w.placeholder) return emptyWeek(w?w.num:1);
  const coches = suivi(w.id).coches || {};
  const enStock = i => PLACARD[aliment(i.label)];
  const all = (w.courses||[]).flatMap(r=>r.items||[]).filter(i=>!enStock(i));
  const stock = (w.courses||[]).flatMap(r=>r.items||[]).filter(enStock);
  const n = all.filter(i=>coches[i.id]).length;
  const pct = all.length ? Math.round(100*n/all.length) : 0;
  const rayons = (w.courses||[]).map(r=>{
    const items = (r.items||[]).filter(i=>!enStock(i) && !(state.hideDone && coches[i.id]));
    if (!items.length) return "";
    return `<section class="card rayon"><h3>${esc(r.rayon)}</h3>${items.map(i=>{
      const on = !!coches[i.id];
      return `<div class="row ${on?"is-done":""}" data-coche="${esc(i.id)}"><button class="tick" role="checkbox" aria-checked="${on}" aria-label="${esc(i.label)}">${CHECK}</button><span class="lbl">${adapt(i.label)}</span><button class="mini" data-placard="${esc(i.label)}" aria-label="J'en ai déjà : ${esc(i.label)}">J'en ai</button></div>`;
    }).join("")}</section>`;
  }).join("");
  return `<h2>Liste de courses</h2>
    ${w.courses_note?`<p class="sub">${esc(w.courses_note)}</p>`:""}
    <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><span class="count">${n} / ${all.length}</span></div>
    <div class="tools">
      <button class="btn" id="hide-done">${state.hideDone?"Afficher les articles cochés":"Masquer les articles cochés"}</button>
      ${state.confirmReset
        ? `<button class="btn warn" id="reset-yes">Oui, tout décocher</button><button class="btn" id="reset-no">Annuler</button>`
        : `<button class="btn" id="reset">Tout décocher</button>`}
    </div>
    ${rayons || (n? `<div class="card empty"><b>Tout est dans le panier</b>Bonnes courses terminées.</div>` : "")}
    <section class="card placard"><h3 style="font-family:var(--f-display);margin:0;font-size:1rem">Déjà dans le placard (${stock.length})</h3>
    <p class="note" style="margin:4px 0 0">Touche « J'en ai » sur un article que tu as encore (miel, chia, épices…). Il disparaît de la liste, cette semaine et les suivantes, jusqu'à ce que tu le remettes.</p>
    ${stock.length?`<ul>${stock.map(i=>`<li><span class="lbl">${adapt(i.label)}</span><button class="mini" style="margin-left:auto" data-unplacard="${esc(i.label)}">Remettre</button></li>`).join("")}</ul>`:""}</section>`;
}

function viewBatch(w){
  if (!w || w.placeholder) return emptyWeek(w?w.num:1);
  const b = w.batch || {};
  return `<h2>${esc(b.titre || "Batch cooking du dimanche")}</h2>
    ${b.intro?`<section class="card"><p style="margin:0">${adapt(b.intro)}</p></section>`:""}
    ${(b.etapes||[]).length?`<section class="card"><ol class="steps">${b.etapes.map(s=>`<li>${adapt(s)}</li>`).join("")}</ol></section>`:""}
    ${(b.boites||[]).length?`<h2>Les boîtes, une par une</h2>${b.boites.map(x=>`<section class="card boite"><h3>${esc(x.jour)}</h3>${Array.isArray(x.contenu)?`<ul>${x.contenu.map(c=>`<li>${adapt(c)}</li>`).join("")}</ul>`:`<p style="margin:0">${adapt(x.contenu)}</p>`}</section>`).join("")}`:""}
    ${b.note?`<p class="note">${esc(b.note)}</p>`:""}`;
}

function viewGouts(){
  const items = GOUTS.map((g,i)=>`<li><div class="gtxt"><b>${esc(g.a)}</b><small>${g.r?"remplacé par "+esc(g.r):"pas de remplacement : signalé dans les menus"}</small></div><button class="x" data-gdel="${i}" aria-label="Retirer ${esc(g.a)}">×</button></li>`).join("");
  return `<h2>Aliments que je n'aime pas</h2>
    <p class="sub">Ajoute un aliment et ce que tu veux à la place. L'appli le remplace tout de suite dans les menus, les courses et le batch cooking.</p>
    <section class="card"><form class="gform" id="gout-form">
      <div><label for="gout-a">Je n'aime pas</label><input id="gout-a" autocomplete="off" placeholder="ex. saumon" required></div>
      <div><label for="gout-r">Remplacer par</label><input id="gout-r" autocomplete="off" placeholder="ex. cabillaud (facultatif)"></div>
      <button class="btn primary" type="submit">Ajouter</button></form></section>
    ${items?`<section class="card"><ul class="glist">${items}</ul></section>
    <section class="card"><p class="note" style="margin:0 0 10px">Pour que je refasse de vrais plats sans ces aliments dans les prochains cycles, copie ta liste et colle-la dans ta conversation avec Claude.</p>
    <button class="btn" id="gout-copy">Copier ma liste pour Claude</button> <span class="note" id="gout-msg"></span>
    <textarea id="gout-txt" readonly hidden style="width:100%;margin-top:10px;font:inherit" rows="4"></textarea></section>`
    : `<div class="card empty"><b>Aucun aliment pour l'instant</b>Ajoute le premier ci-dessus : par exemple « champignons », remplacés par « courgettes ».</div>`}`;
}
function viewNotes(){
  const top = Object.keys(NOTES).filter(k=>NOTES[k]==="top"), bof = Object.keys(NOTES).filter(k=>NOTES[k]==="bof");
  const liste = (arr,l)=>arr.length?`<h4 style="margin:10px 0 4px">${l} (${arr.length})</h4><ul class="note" style="margin:0;padding-left:1.1em">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  return `<h2>Mes plats notés</h2>
    <section class="card"><p class="note" style="margin:0">Sous chaque déjeuner et dîner, touche « J'adore » ou « Bof ». Je m'en sers pour les prochains cycles : plus de plats que tu aimes, moins de ceux qui ne te plaisent pas.</p>
    ${liste(top,"J'adore")}${liste(bof,"Bof")}
    ${top.length+bof.length?`<p style="margin:12px 0 0"><button class="btn" id="note-copy">Copier mes notes pour Claude</button> <span class="note" id="note-msg"></span></p>
    <textarea id="note-txt" readonly hidden style="width:100%;margin-top:10px;font:inherit" rows="4"></textarea>`:""}</section>`;
}
function notesTexte(){
  const f = n => Object.keys(NOTES).filter(k=>NOTES[k]===n);
  return [f("top").length?"Plats que j'adore : "+f("top").join(" ; ")+".":"", f("bof").length?"Plats bof : "+f("bof").join(" ; ")+".":""].filter(Boolean).join("\n");
}
function goutsTexte(){ return "Aliments que je n'aime pas : " + GOUTS.map(g=>g.a+(g.r?" (remplacé par "+g.r+")":"")).join(", ") + "."; }

function render(){
  renderWeeks();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===state.tab ? "page":"false"));
  const v = document.getElementById("view");
  if (!state.ready){ v.innerHTML = `<div class="card empty"><b>Ton carnet se charge</b>Tes menus, ta liste de courses et le batch du dimanche apparaissent dans un instant.</div>`; return; }
  const w = state.weeks[state.week] || {id:state.week, num:Number(String(state.week||"s1").slice(1)), placeholder:true};
  v.innerHTML = ({jour:viewJour, semaine:viewSemaine, courses:viewCourses, batch:viewBatch, gouts:w=>viewGouts()+viewNotes()}[state.tab] || viewJour)(w);
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button, .row");
  if (!t) return;
  if (t.dataset.tab){ state.tab = t.dataset.tab; state.confirmReset=false; try{localStorage.setItem("tab",state.tab)}catch(_){} render(); window.scrollTo(0,0); return; }
  if (t.dataset.week){ state.week = t.dataset.week; state.confirmReset=false; render(); return; }
  if (t.dataset.gdel){ GOUTS.splice(Number(t.dataset.gdel),1); saveGouts(); render(); return; }
  if (t.dataset.note){ const p=t.dataset.plat; if (NOTES[p]===t.dataset.note) delete NOTES[p]; else NOTES[p]=t.dataset.note; saveKey(NK,NOTES); render(); return; }
  if (t.dataset.placard){ PLACARD[aliment(t.dataset.placard)]=true; saveKey(PK,PLACARD); render(); return; }
  if (t.dataset.unplacard){ delete PLACARD[aliment(t.dataset.unplacard)]; saveKey(PK,PLACARD); render(); return; }
  if (t.id==="gout-copy" || t.id==="note-copy"){
    const k = t.id.split("-")[0], txt = k==="gout"?goutsTexte():notesTexte(), msg = document.getElementById(k+"-msg"), ta = document.getElementById(k+"-txt");
    const fallback = ()=>{ ta.hidden=false; ta.value=txt; ta.focus(); ta.select(); msg.textContent="Sélectionné : copie-le."; };
    try{ navigator.clipboard.writeText(txt).then(()=>{ msg.textContent="Copié. Colle-le dans la conversation avec Claude."; }, fallback); }catch(_){ fallback(); }
    return;
  }
  const w = state.weeks[state.week]; if (!w) return;
  if (t.dataset.open){ state.open = state.open===t.dataset.open ? null : t.dataset.open; render(); return; }
  if (t.dataset.swap){ write(w.id,{swaps:{[t.dataset.swap]: t.dataset.src}}); state.open=null; render(); return; }
  if (t.dataset.fait){ const k=t.dataset.fait; write(w.id,{faits:{[k]:!(suivi(w.id).faits||{})[k]}}); return; }
  if (t.dataset.type){ const j=(w.jours||[]).find(x=>x.j===t.dataset.type); const cur=dayType(w,j); const nxt=TYPES[(TYPES.indexOf(cur)+1)%TYPES.length]; write(w.id,{types:{[j.j]:nxt}}); return; }
  const row = e.target.closest(".row");
  if (row && row.dataset.coche){ const k=row.dataset.coche; write(w.id,{coches:{[k]:!(suivi(w.id).coches||{})[k]}}); return; }
  if (t.id==="hide-done"){ state.hideDone=!state.hideDone; try{localStorage.setItem("hideDone",state.hideDone?"1":"0")}catch(_){} render(); return; }
  if (t.id==="reset"){ state.confirmReset=true; render(); return; }
  if (t.id==="reset-no"){ state.confirmReset=false; render(); return; }
  if (t.id==="reset-yes"){ state.confirmReset=false; const off={}; Object.keys(suivi(w.id).coches||{}).forEach(k=>off[k]=false); write(w.id,{coches:off}); return; }
});

document.addEventListener("input", e=>{
  if (e.target.id==="ravito-min"){ state.ravito = Number(e.target.value)||0; document.getElementById("ravito-out").innerHTML = ravito(state.ravito); return; }
  if (e.target.id!=="gout-a") return;
  const r = document.getElementById("gout-r"); const sug = SUGG[e.target.value.trim().toLowerCase()];
  if (!r.value || r.value === r.dataset.sug){ r.value = sug || ""; }
  r.dataset.sug = sug || "";
});
document.addEventListener("submit", e=>{
  if (e.target.id==="ravito-form"){ e.preventDefault(); e.target.querySelector("input").blur(); return; }
  if (e.target.id!=="gout-form") return;
  e.preventDefault();
  const a = document.getElementById("gout-a").value.trim(); const ri = document.getElementById("gout-r");
  const r = ri.value.trim();
  if (!a || GOUTS.some(g=>norm(g.a)===norm(a))) return;
  GOUTS.push({a, r}); saveGouts(); render();
});
document.addEventListener("submit", e=>{
  if (e.target.id!=="poids-form") return;
  e.preventDefault();
  const v = parseFloat(String(document.getElementById("poids-kg").value).replace(",","."));
  if (!(v>=30 && v<=150)) return;
  write("poids",{entries:{[iso(new Date())]:Math.round(v*10)/10}});
});

render();

const LS="carnet-suivi";
try{ state.suivi = JSON.parse(localStorage.getItem(LS)||"{}"); }catch(_){ state.suivi={}; }
function applyData(d){
  state.weeks={}; (d.semaines||[]).forEach(x=>state.weeks[x.id]=x); state.profil=d.profil||null; state.recettes=d.recettes||{};
  if(!state.ready){ state.ready=true; state.week=currentWeekId()||"s1"; }
  render();
}
(async ()=>{
  try{ const c=localStorage.getItem("carnet-data"); if(c){ applyData(JSON.parse(c)); setSync("Hors ligne"); } }catch(_){}
  try{
    const r=await fetch("data.json",{cache:"no-cache"}); const d=await r.json();
    try{localStorage.setItem("carnet-data",JSON.stringify(d))}catch(_){}
    applyData(d); setSync("À jour");
  }catch(e){ if(!state.ready){ state.ready=true; render(); } setSync("Hors ligne"); }
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
